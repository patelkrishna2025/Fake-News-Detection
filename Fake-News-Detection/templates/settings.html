{% extends "base.html" %}
{% block title %}Settings - FakeNewsAI{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h2 class="fw-bold mb-3"><i class="fa-solid fa-gear me-2"></i>Settings</h2>
    <div class="card border-0 shadow-sm p-4">
      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" id="darkModeSwitch">
        <label class="form-check-label" for="darkModeSwitch">Dark Mode</label>
      </div>
      <p class="text-muted small mb-0">This application runs 100% locally. No data is sent to any external server or API.</p>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('darkModeSwitch').addEventListener('change', function(){
  document.getElementById('themeToggle').click();
});
</script>
{% endblock %}
